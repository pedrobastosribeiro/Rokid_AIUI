name: PR Checks

on:
  # Both `push` and `pull_request`, because either one alone has failed here.
  #
  # `pull_request` stopped being delivered for #19: no run on open, and none on
  # any of four subsequent pushes, while `workflow_dispatch` on the same branch
  # worked every time. The cause is upstream of this file -- the trigger block
  # was already unfiltered -- so the answer is redundancy rather than a fix.
  # Check runs attach to the head commit, not to the event that produced them,
  # so a push-triggered run populates a pull request's checks identically;
  # verified on #19, where dispatched runs show up as its three checks.
  push:
    branches-ignore:
      # Generated publish branches. Their root is the sample, not the repo, so
      # there is no validator to run there at all -- and `pt-br` is force-pushed
      # on every push to `main`, which would add a second, always-failing run to
      # every commit.
      - pt-br
      - pt-br-preview
  # `synchronize` is what checks a pull request's later commits. A fork's pushes
  # never reach this repository at all, so without it a fork contributor is
  # checked once on `opened` and every commit after that inherits the tick.
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  workflow_dispatch:
  # Callable so the publish workflow gates on these same checks instead of
  # running in parallel with them. See publish-create-aiui-agent.yml.
  workflow_call:

# Grouped per event, per repository, per branch -- and the event is load-bearing.
#
# `push` and `pull_request` both fire for a commit on a same-repo branch. Under
# a shared key one cancelled the other, and GitHub reports a cancelled check as
# "not successful", so every healthy pull request rendered partly red. That is
# not cosmetic: a checks list that is always partly red teaches its reader that
# red is normal, and the next genuine failure then looks like the background.
#
# Keying on the event keeps that pair apart. Both runs complete, which costs
# about a minute of duplicated CI per push against jobs of roughly 25 seconds.
#
# Worth paying, because the two runs do not check the same tree:
#
#   * the `push` run checks out the branch tip;
#   * the `pull_request` run checks out the synthetic merge commit -- the tree
#     that will actually land on `main`.
#
# A branch behind its base can be green at the tip and broken once merged. A
# sample renamed on `main` against a link added here is enough: `links` passes
# on both trees separately and fails on the merge. Only the `pull_request` run
# ever sees that. And a pull request that edits the trigger block above can stop
# matching `push` altogether -- narrowing `push.branches`, or coming from a
# `branches-ignore` ref -- in which case the `push` run does not exist and the
# `pull_request` run is the only one there is.
#
# An earlier revision of this branch skipped the `pull_request` jobs for
# same-repo pull requests to avoid the duplicate, which is why both hazards are
# written down here instead of being rediscovered. Skipping a run is only free
# when it is genuinely redundant, and this one is not.
#
# Within one event, cancellation still means what it should: a newer commit
# supersedes an older run on the same branch, and the cancelled check lands on
# the commit that was superseded rather than on HEAD.
#
# The repository is in the key because a branch name is not unique across forks:
# two fork pull requests both opened from `main` must not cancel each other.
concurrency:
  group: >-
    pr-checks-${{ github.workflow }}-${{ github.event_name }}-${{
      github.event.pull_request.head.repo.full_name || github.repository
    }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # Both runs land in the same checks list, so the name has to say which tree
    # failed. The `pull_request` run keeps the bare name and the `push` run is
    # the one qualified, which is the opposite of what it looks like it should
    # be. Two reasons, and the first is the load-bearing one:
    #
    #   * the `pull_request` run is the only one every pull request has. A fork
    #     never pushes here, and a branch under `branches-ignore` gets no push
    #     run either. Qualifying that run instead would leave exactly those
    #     pull requests with no check under the plain name, so anything
    #     configured against "Validate" would go unsatisfied precisely where
    #     this run is the sole coverage;
    #   * it is also the more authoritative of the two -- it checks the merge
    #     result, which is the tree that lands.
    #
    # Tested for `push` specifically, not `!= 'pull_request'`. A dispatched run
    # is the documented fallback for `pull_request` delivery failing, as it did
    # on #19, and its checks attach to the pull request the same way. Suffixing
    # it would leave the fallback unable to satisfy a bare required context --
    # blocking the pull request it exists to unblock.
    name: "Validate${{ github.event_name == 'push' && ' (branch tip)' || '' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Run each check as its own step so a failure names itself in the UI
      # instead of hiding inside one aggregate log.
      - name: JSON parses
        run: node scripts/ci/validate.mjs json

      - name: Scripts parse
        run: node scripts/ci/validate.mjs syntax

      - name: Sample pages and components resolve
        run: node scripts/ci/validate.mjs samples

      # This job names each check explicitly rather than running the whole
      # validator, so a check added to validate.mjs does not run here until it
      # is also added above. `secrets` spent a day in that gap -- the one check
      # whose entire job is to stop a provider key reaching a public repository,
      # and the only backstop that covers a commit authored in the GitHub web
      # UI, where nothing local ever runs.
      - name: No provider keys in tracked files
        run: node scripts/ci/validate.mjs secrets

      - name: Markdown links resolve
        run: node scripts/ci/validate.mjs links

      - name: No trailing whitespace in source
        run: node scripts/ci/validate.mjs whitespace

      - name: Unit tests
        run: node scripts/ci/validate.mjs tests

  pack:
    name: "Pack every sample${{ github.event_name == 'push' && ' (branch tip)' || '' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Its own job because it fetches aix-cli and packs every sample, which is
      # far slower than the static checks above.
      - name: Pack and inspect
        run: node scripts/ci/validate.mjs pack

  scaffold:
    name: "Scaffold a project from the packed package${{ github.event_name == 'push' && ' (branch tip)' || '' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Scaffolding from the source tree would pass even if `files` or an
      # .npmignore dropped template/ from the published package, so build the
      # real artifact and drive the CLI the way `npx` would.
      - name: Pack the package
        id: pack
        working-directory: packages/create-aiui-agent
        run: echo "tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP")" >> "$GITHUB_OUTPUT"

      - name: Install the packed artifact
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-audit --no-fund "./${{ steps.pack.outputs.tarball }}"

      - name: Scaffold a project with the installed CLI
        working-directory: ${{ runner.temp }}
        run: ./node_modules/.bin/create-aiui-agent smoke-agent

      - name: Check the scaffolded project
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          for f in app.js app.json package.json pages/index/index.ink AGENTS.md; do
            test -f "smoke-agent/$f" || { echo "missing $f in scaffolded project"; exit 1; }
          done
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('smoke-agent/package.json', 'utf8'));
            if (pkg.name !== 'smoke-agent') {
              throw new Error('{{PROJECT_NAME}} was not substituted: ' + pkg.name);
            }
            for (const file of ['smoke-agent/app.json', 'smoke-agent/package.json']) {
              JSON.parse(fs.readFileSync(file, 'utf8'));
            }
          "
