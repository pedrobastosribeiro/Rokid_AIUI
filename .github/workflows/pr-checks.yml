name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  # Callable so the nightly publish can gate on these same checks instead of
  # running in parallel with them. See daily-build.yml.
  workflow_call:

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Run each check as its own step so a failure names itself in the UI
      # instead of hiding inside one aggregate log.
      - name: JSON parses
        run: node scripts/ci/validate.mjs json

      - name: Scripts parse
        run: node scripts/ci/validate.mjs syntax

      - name: Sample pages and components resolve
        run: node scripts/ci/validate.mjs samples

      - name: Markdown links resolve
        run: node scripts/ci/validate.mjs links

      - name: No trailing whitespace in source
        run: node scripts/ci/validate.mjs whitespace

      - name: Unit tests
        run: node scripts/ci/validate.mjs tests

  pack:
    name: Pack every sample
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Its own job because it fetches aix-cli and packs every sample, which is
      # far slower than the static checks above.
      - name: Pack and inspect
        run: node scripts/ci/validate.mjs pack

  scaffold:
    name: Scaffold a project from the packed package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Scaffolding from the source tree would pass even if `files` or an
      # .npmignore dropped template/ from the published package, so build the
      # real artifact and drive the CLI the way `npx` would.
      - name: Pack the package
        id: pack
        working-directory: packages/create-aiui-agent
        run: echo "tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP")" >> "$GITHUB_OUTPUT"

      - name: Install the packed artifact
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-audit --no-fund "./${{ steps.pack.outputs.tarball }}"

      - name: Scaffold a project with the installed CLI
        working-directory: ${{ runner.temp }}
        run: ./node_modules/.bin/create-aiui-agent smoke-agent

      - name: Check the scaffolded project
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          for f in app.js app.json package.json pages/index/index.ink AGENTS.md; do
            test -f "smoke-agent/$f" || { echo "missing $f in scaffolded project"; exit 1; }
          done
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('smoke-agent/package.json', 'utf8'));
            if (pkg.name !== 'smoke-agent') {
              throw new Error('{{PROJECT_NAME}} was not substituted: ' + pkg.name);
            }
            for (const file of ['smoke-agent/app.json', 'smoke-agent/package.json']) {
              JSON.parse(fs.readFileSync(file, 'utf8'));
            }
          "
