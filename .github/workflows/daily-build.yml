name: Daily Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  # The nightly publish is unattended, so it gates on the same checks a PR
  # gets -- including the one that scaffolds a project from the packed
  # artifact. Without this the publish would race them and ship regardless.
  checks:
    uses: ./.github/workflows/pr-checks.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish create-aiui-agent
        run: |
          cd packages/create-aiui-agent
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
